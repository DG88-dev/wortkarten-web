<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#152127"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Wortkarten</title><link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css?v=4"></head>
<body><div id="app"><header class="header"><a class="brand" href="./"><img src="icon.png" alt=""><span>Wortkarten<small>Német és angol szókártyák</small></span></a><div class="header-actions"><div class="segments" aria-label="Gyakorolt nyelv"><button id="lang-de" aria-pressed="true">Német</button><button id="lang-en" aria-pressed="false">Angol</button></div><button id="account" class="quiet">Bejelentkezés</button><details class="menu"><summary aria-label="További lehetőségek">•••</summary><div class="menu-panel"><button id="export">Jelölések exportálása</button><button id="import">Jelölések importálása</button><button id="retry">Szinkronizálás újrapróbálása</button></div></details></div></header>
<div id="notice" role="status" hidden></div>
<section id="setup"><aside><div class="eyebrow">SZŰRŐK</div><div id="filters"></div><div class="rank-control"><div class="field-title">Sorszámtartomány</div><div class="rank-values"><output id="rank-low">—</output><output id="rank-high">—</output></div><div class="dual-range"><div class="range-track"></div><div id="range-fill"></div><input id="range-low" type="range" aria-label="Sorszámtartomány alsó értéke"><input id="range-high" type="range" aria-label="Sorszámtartomány felső értéke"></div></div><label class="check"><input type="checkbox" id="exclude" checked>Elrejtett szavak kihagyása</label><button id="clear" class="text-button">Szűrők törlése</button><footer class="sidebar-footer"><span id="loaded">Szókészlet betöltése…</span><span id="mark-counts"></span><span id="sync-status" role="status">Jelölések ezen az eszközön</span></footer></aside>
<main><div class="setup-top"><div class="match-count"><strong id="total">—</strong><span>szó felel meg a szűrőknek</span></div><div class="field-title">Gyakorlás iránya</div><div id="direction" class="segments wide"><button data-direction="hu" aria-pressed="true">magyar → német</button><button data-direction="foreign" aria-pressed="false">német → magyar</button></div><div class="start-row"><div class="word-count"><label for="count">Szavak száma</label><div><input id="count" type="number" min="1" max="10000" value="20"><button id="all" class="quiet">Összes</button></div></div><div class="start-buttons"><button id="start-article" class="primary" hidden>Der, Die, Das</button><button id="start" class="primary">Gyakorlás indítása <span aria-hidden="true">→</span></button></div></div><label class="field-title" for="search">Szótár</label><div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Keresés: német szó vagy magyar jelentés" autocomplete="off"></div></div><div id="word-list" class="word-list" role="table" aria-label="Szólista" tabindex="0"></div></main></section>
<section id="practice" hidden><div class="practice-nav"><button id="back" class="quiet">← Beállítások</button><span id="practice-title">Szókártyák</span></div><article id="card"><div class="card-top"><span id="card-level"></span><span id="progress"></span></div><div id="card-content"></div><div id="article-answers" hidden><button data-article="der">Der</button><button data-article="die">Die</button><button data-article="das">Das</button></div><div id="feedback" aria-live="polite"></div><div class="card-footer"><div id="card-marks"></div><button id="shuffle" class="quiet" hidden>Keverés</button></div></article><div id="normal-controls"><button id="previous" class="quiet">← Előző</button><button id="flip" class="primary">Megfordítás</button><button id="next" class="quiet">Következő →</button></div></section>
<section id="finished" hidden><div class="finish-icon" aria-hidden="true">✓</div><h1>A gyakorlás véget ért</h1><p id="finish-detail"></p><div><button id="finish-back" class="quiet">Beállítások</button><button id="restart" class="primary">Új kör</button></div></section></div><input id="import-file" type="file" accept="application/json,.json" hidden><script type="module" src="app.js?v=4"></script></body></html>
